# Order details page → "More actions" → Add India Post tracking.
# Opens the app with ?id=<order id>, which shows the "Create order" form for that order.
[[extensions]]
name = "Add India Post tracking"
description = "Enter the India Post tracking number for this order and mark it fulfilled"
handle = "create-indiapost-shipment"
type = "admin_link"

  [[extensions.targeting]]
  target = "admin.order-details.action.link"
  url = "/"
