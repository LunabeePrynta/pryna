# Shopify app configuration. Run `shopify app config link` to connect this file to your app
# in the Partner Dashboard, then `shopify app deploy` to push scopes, webhooks and the app proxy.
client_id = "YOUR_SHOPIFY_API_KEY"
name = "India Post Shipping"
application_url = "https://ship.lunabee.in"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Orders + fulfillments (tracking numbers, delivery events) + customers/orders metafields.
scopes = "read_orders,write_orders,read_customers,write_customers,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,write_third_party_fulfillment_orders,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,write_fulfillments"

[auth]
redirect_urls = ["https://ship.lunabee.in/auth/callback"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "app/uninstalled"]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/shopify"

# Storefront tracking page: https://<store>/apps/track?awb=EB123456785IN
[app_proxy]
url = "https://ship.lunabee.in/proxy"
subpath = "track"
prefix = "apps"

[pos]
embedded = false
